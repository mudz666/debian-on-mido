name: Build kernel and system image

on:
  push:
    branches:
      - main
    paths:
      - config
      - env.sh
      - firmware/**
      - scripts/build-lk2nd.sh
      - scripts/build-system-image.sh
      - .github/workflows/build-kernel.yml
  pull_request:
    paths:
      - config
      - env.sh
      - firmware/**
      - scripts/build-lk2nd.sh
      - scripts/build-system-image.sh
      - .github/workflows/build-kernel.yml
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel branch, tag, or commit to build
        required: true
        default: 6.16.3/main
        type: string
      build_system_image:
        description: Build flashable Debian system images
        required: true
        default: true
        type: boolean
      desktop_environment:
        description: Desktop environment included in the system image
        required: true
        default: phosh
        type: choice
        options:
          - phosh
          - xfce
          - none

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPOSITORY: https://github.com/msm8953-mainline/linux.git
  KERNEL_REF: ${{ inputs.kernel_ref || '6.16.3/main' }}
  LK2ND_REF: 6752fb8abe45e079f13ed203c7198d5a93f965ed

jobs:
  build:
    name: Build ARM64 Debian packages
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate build scripts
        run: bash -n env.sh scripts/build-lk2nd.sh scripts/build-system-image.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc \
            bison \
            build-essential \
            cpio \
            debhelper \
            dwarves \
            fakeroot \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            pkg-config \
            rsync

      - name: Fetch kernel source
        shell: bash
        run: |
          git init linux
          git -C linux remote add origin "$KERNEL_REPOSITORY"
          git -C linux fetch --depth=1 origin "$KERNEL_REF"
          git -C linux checkout --detach FETCH_HEAD

      - name: Configure kernel
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/env.sh"
          cp "$GITHUB_WORKSPACE/config" "$GITHUB_WORKSPACE/linux/.config"
          make -C "$GITHUB_WORKSPACE/linux" olddefconfig

      - name: Build kernel and Debian packages
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/env.sh"
          make -C "$GITHUB_WORKSPACE/linux" -j"$(nproc)" Image.gz dtbs modules
          make -C "$GITHUB_WORKSPACE/linux" -j"$(nproc)" \
            DEB_BUILD_PROFILES=pkg.linux-upstream.nokernelheaders \
            bindeb-pkg

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp linux/arch/arm64/boot/Image.gz artifacts/
          cp linux/.config artifacts/kernel.config
          git -C linux rev-parse HEAD > artifacts/kernel-source-revision.txt

          find linux/arch/arm64/boot/dts/qcom \
            -maxdepth 1 -type f -name '*mido*.dtb' \
            -exec cp --target-directory=artifacts {} +
          find . -maxdepth 1 -type f -name '*.deb' ! -name '*-dbg_*' \
            -exec cp --target-directory=artifacts {} +

          test -n "$(find artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -type f -name '*mido*.dtb' -print -quit)"
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mido-kernel-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  image:
    name: Build Debian system images
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_system_image) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: mido-kernel-${{ github.run_number }}-${{ github.run_attempt }}
          path: kernel-artifacts

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            android-sdk-libsparse-utils \
            binfmt-support \
            ca-certificates \
            debootstrap \
            device-tree-compiler \
            e2fsprogs \
            gcc-arm-none-eabi \
            libfdt-dev \
            make \
            qemu-user-static \
            rsync \
            uuid-runtime

      - name: Fetch ALSA configuration
        run: |
          git clone --depth=1 \
            https://github.com/msm8953-mainline/alsa-ucm-conf.git \
            alsa-ucm-conf

      - name: Build system images
        shell: bash
        run: |
          sudo env \
            KERNEL_ARTIFACTS="$GITHUB_WORKSPACE/kernel-artifacts" \
            OUTPUT_DIR="$GITHUB_WORKSPACE/system-artifacts" \
            UCM_SOURCE_DIR="$GITHUB_WORKSPACE/alsa-ucm-conf/ucm2" \
            DESKTOP_ENVIRONMENT="${{ inputs.desktop_environment || 'phosh' }}" \
            bash scripts/build-system-image.sh
          sudo chown -R "$USER:$USER" system-artifacts

      - name: Build lk2nd images
        shell: bash
        run: |
          OUTPUT_DIR="$GITHUB_WORKSPACE/system-artifacts" \
            LK2ND_REF="$LK2ND_REF" \
            bash scripts/build-lk2nd.sh

      - name: Upload system images
        uses: actions/upload-artifact@v4
        with:
          name: mido-system-${{ inputs.desktop_environment || 'phosh' }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: system-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
